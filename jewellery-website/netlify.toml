# ── Netlify configuration ──────────────────────────────────────────────────────

[build]
  # Base directory — where package.json lives (relative to repo root)
  base    = "jewellery-website"
  # Build command — runs inside base directory
  command = "npm run build"
  # Publish directory — relative to base directory
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ── SPA routing fix ────────────────────────────────────────────────────────────
# Sends every URL to index.html so React Router handles navigation
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Security headers ───────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
