# ── Netlify configuration ──────────────────────────────────────────────────────

[build]
  # Directory to run the build command from
  base    = "jewellery-website"
  # Build command
  command = "npm run build"
  # Directory to publish (relative to base)
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ── SPA routing fix ────────────────────────────────────────────────────────────
# Without this, refreshing any sub-page (e.g. /shop) returns a 404 on Netlify.
# This redirect sends every request that doesn't match a static file back to
# index.html so React Router can handle it client-side.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Security headers ───────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# Cache immutable hashed assets (Vite fingerprints JS/CSS filenames)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
