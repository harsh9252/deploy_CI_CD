name: CI — Lint & Build

# Run on every push and every pull request targeting main
on:
  push:
    branches: ["main", "master"]
    paths:
      - "jewellery-website/**"
      - ".github/workflows/**"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "jewellery-website/**"
      - ".github/workflows/**"

defaults:
  run:
    working-directory: jewellery-website   # all steps run inside the app folder

jobs:
  ci:
    name: Install → Lint → Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]               # matches local Node 20

    steps:
      # 1. Check out the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up the correct Node version
      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: jewellery-website/package-lock.json

      # 3. Install dependencies (clean install)
      - name: Install dependencies
        run: npm ci

      # 4. Lint the source code
      - name: Run ESLint
        run: npm run lint

      # 5. Run tests (currently a placeholder — add Vitest/Jest later)
      - name: Run tests
        run: npm test

      # 6. Production build — confirms the app compiles without errors
      - name: Build for production
        run: npm run build

      # 7. Upload the built artefact so the deploy job can consume it
      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: jewellery-website/dist
          retention-days: 1             # only needed long enough for the deploy job
